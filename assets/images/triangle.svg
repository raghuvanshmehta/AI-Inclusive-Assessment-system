<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="200" role="img" aria-label="Right-angled triangle with sides 6cm and 8cm">
  <rect width="100%" height="100%" fill="#f8fafc" rx="8" />
  <!-- Triangle -->
  <polygon points="50,160 250,160 50,40" fill="#e0e7ff" stroke="#4338ca" stroke-width="3" />
  <!-- Right angle marker -->
  <polyline points="50,140 70,140 70,160" fill="none" stroke="#4338ca" stroke-width="2" />
  <!-- Side Labels -->
  <text x="25" y="105" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e293b">6 cm</text>
  <text x="140" y="180" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e293b">8 cm</text>
  <text x="160" y="90" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4338ca">Hypotenuse = ?</text>
</svg>
